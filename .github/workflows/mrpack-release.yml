# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    tags:
      - 'v*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download CLI
      run: |
        curl -sSL -o ./cli https://atlas.nathanm.org/download/cli
        chmod +x ./cli

    - name: Build mrpack
      run: ./cli build --format mrpack -o "poiesis-${{ github.ref_name }}.mrpack"
        
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: poiesis-${{ github.ref_name }}.mrpack
      
      
      
        
      
    
